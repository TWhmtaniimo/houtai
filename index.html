<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>橘子平台｜打手登入</title>
<style>
  :root{
    --orange:#ff7a00;
    --orange-2:#ff9a3d;
    --orange-soft:#fff3e8;
    --ink:#1f2937;
    --muted:#6b7280;
    --line:#ececec;
    --bg:#fffaf5;
    --card:#ffffff;
    --danger:#dc2626;
    --success:#0f9f6e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
  body{min-height:100vh;overflow-x:hidden}

  .page{
    min-height:100vh;
    display:grid;
    grid-template-columns:1.1fr .9fr;
    background:
      radial-gradient(circle at 12% 10%, rgba(255,154,61,.20), transparent 28%),
      linear-gradient(135deg,#fffdf9 0%,#fff8f1 45%,#fff4e9 100%);
  }

  .brand-side{
    position:relative;
    padding:64px 7vw;
    display:flex;
    flex-direction:column;
    justify-content:center;
    overflow:hidden;
  }
  .blob{
    position:absolute;
    width:420px;height:420px;border-radius:50%;
    background:linear-gradient(145deg,rgba(255,122,0,.16),rgba(255,154,61,.05));
    right:-160px;top:-120px;
  }
  .blob.b2{width:300px;height:300px;left:-120px;bottom:-100px;right:auto;top:auto;background:rgba(255,122,0,.08)}

  .brand-mark{display:flex;align-items:center;gap:14px;margin-bottom:40px;position:relative;z-index:1}
  .logo{
    width:54px;height:54px;border-radius:18px;
    display:grid;place-items:center;
    background:linear-gradient(135deg,var(--orange),var(--orange-2));
    color:#fff;font-size:30px;
    box-shadow:0 12px 30px rgba(255,122,0,.28);
  }
  .brand-name{font-weight:800;font-size:28px;letter-spacing:.5px}
  .brand-sub{font-size:13px;color:var(--muted);margin-top:2px}

  .hero{position:relative;z-index:1;max-width:640px}
  .tag{
    display:inline-flex;align-items:center;gap:8px;
    background:#fff;border:1px solid #ffe1c2;color:#c35b00;
    padding:9px 13px;border-radius:999px;font-size:13px;font-weight:700;
    box-shadow:0 8px 22px rgba(255,122,0,.08)
  }
  .hero h1{font-size:clamp(38px,5vw,68px);line-height:1.08;margin:22px 0 18px;letter-spacing:-1.5px}
  .hero h1 span{color:var(--orange)}
  .hero p{font-size:18px;line-height:1.8;color:#58616f;max-width:560px;margin:0}

  .trust{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;
    margin-top:34px;max-width:560px
  }
  .trust-item{
    background:rgba(255,255,255,.78);backdrop-filter:blur(10px);
    border:1px solid rgba(255,122,0,.12);border-radius:18px;padding:15px 16px;
    display:flex;align-items:center;gap:11px;color:#4b5563;font-weight:700;font-size:14px
  }
  .check{width:30px;height:30px;border-radius:10px;background:var(--orange-soft);display:grid;place-items:center;color:var(--orange)}

  .login-side{
    display:flex;align-items:center;justify-content:center;
    padding:36px;
  }
  .card{
    width:min(440px,100%);
    background:rgba(255,255,255,.96);
    border:1px solid rgba(255,122,0,.10);
    border-radius:28px;
    padding:36px;
    box-shadow:0 28px 70px rgba(90,55,20,.12);
    position:relative;
  }
  .card:before{
    content:"";position:absolute;top:0;left:36px;right:36px;height:4px;border-radius:0 0 8px 8px;
    background:linear-gradient(90deg,var(--orange),#ffb15f)
  }
  .mobile-brand{display:none;align-items:center;gap:10px;margin-bottom:26px}
  .mobile-brand .mini{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--orange),var(--orange-2));display:grid;place-items:center;color:#fff;font-size:22px}
  .card h2{font-size:30px;margin:6px 0 10px}
  .card .desc{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:28px}
  .field{margin-bottom:17px}
  .label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
  .input-wrap{position:relative}
  input{
    width:100%;height:52px;border:1px solid #e5e7eb;border-radius:15px;padding:0 48px 0 16px;
    font-size:16px;outline:none;background:#fff;transition:.2s
  }
  input:focus{border-color:#ffb066;box-shadow:0 0 0 4px rgba(255,122,0,.10)}
  .icon{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:18px;cursor:pointer;user-select:none}
  .error{display:none;background:#fff1f2;border:1px solid #fecdd3;color:#b42318;padding:11px 13px;border-radius:12px;font-size:13px;margin:4px 0 14px}
  .btn{
    width:100%;height:54px;border:0;border-radius:15px;font-size:16px;font-weight:800;cursor:pointer;transition:.2s
  }
  .btn-login{background:linear-gradient(135deg,var(--orange),#ff9632);color:#fff;box-shadow:0 12px 24px rgba(255,122,0,.24)}
  .btn-login:hover{transform:translateY(-1px);box-shadow:0 16px 30px rgba(255,122,0,.30)}
  .register-row{text-align:center;margin-top:18px;color:#6b7280;font-size:14px}
  .register-link{color:var(--orange);font-weight:800;cursor:pointer;text-decoration:none;margin-left:4px}
  .divider{display:flex;align-items:center;gap:10px;color:#b3b7bf;font-size:12px;margin:24px 0 18px}
  .divider:before,.divider:after{content:"";height:1px;flex:1;background:#eceff2}
  .note{display:flex;gap:10px;padding:12px 13px;border-radius:14px;background:#fff8f1;color:#7a4d21;font-size:13px;line-height:1.6}
  .shield{font-size:18px}

  .modal{
    position:fixed;inset:0;background:rgba(17,24,39,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:100
  }
  .modal.show{display:flex}
  .modal-card{width:min(390px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 30px 90px rgba(0,0,0,.20);text-align:center}
  .modal-icon{width:64px;height:64px;margin:0 auto 16px;border-radius:20px;background:var(--orange-soft);display:grid;place-items:center;font-size:34px}
  .modal-card h3{margin:0 0 10px;font-size:22px}
  .modal-card p{margin:0;color:#6b7280;font-size:14px;line-height:1.8}
  .modal-card .btn{margin-top:22px;background:#111827;color:#fff}

  @media(max-width:900px){
    .page{grid-template-columns:1fr}
    .brand-side{display:none}
    .login-side{padding:22px;min-height:100vh;background:
      radial-gradient(circle at 0% 0%, rgba(255,154,61,.18), transparent 30%),
      linear-gradient(180deg,#fffaf4,#fff)}
    .card{padding:28px 22px;border-radius:24px}
    .mobile-brand{display:flex}
  }
  @media(max-width:480px){
    .login-side{padding:14px}
    .card{padding:24px 18px}
    .card h2{font-size:26px}
  }
</style>
</head>
<body>
  <main class="page">
    <section class="brand-side">
      <div class="blob"></div><div class="blob b2"></div>
      <div class="brand-mark">
        <div class="logo">🍊</div>
        <div>
          <div class="brand-name">橘子平台</div>
          <div class="brand-sub">遊戲接單服務平台</div>
        </div>
      </div>
      <div class="hero">
        <div class="tag">🎮 打手專屬登入入口</div>
        <h1>輕鬆接單，<br><span>把實力變成收入。</span></h1>
        <p>專為遊戲接單人員打造的工作入口。訂單透明、彈性接單、紀錄清楚，讓每一次接單都更簡單。</p>
        <div class="trust">
          <div class="trust-item"><div class="check">✓</div>訂單資訊透明</div>
          <div class="trust-item"><div class="check">✓</div>彈性安排時間</div>
          <div class="trust-item"><div class="check">✓</div>收入紀錄可查</div>
          <div class="trust-item"><div class="check">✓</div>官方審核帳號</div>
        </div>
      </div>
    </section>

    <section class="login-side">
      <div class="card">
        <div class="mobile-brand">
          <div class="mini">🍊</div>
          <div><strong>橘子平台</strong><div style="font-size:12px;color:#8b8f98;margin-top:2px">遊戲接單服務平台</div></div>
        </div>

        <h2>歡迎回來</h2>
        <div class="desc">請輸入您的打手帳號與密碼，登入專屬接單入口。</div>

        <div id="errorBox" class="error">帳號或密碼錯誤，請重新確認。</div>

        <div class="field">
          <label class="label">帳號</label>
          <div class="input-wrap">
            <input id="account" type="text" placeholder="請輸入帳號" autocomplete="off" />
            <div class="icon">👤</div>
          </div>
        </div>

        <div class="field">
          <label class="label">密碼</label>
          <div class="input-wrap">
            <input id="password" type="password" placeholder="請輸入密碼" autocomplete="off" />
            <div id="togglePwd" class="icon">👁</div>
          </div>
        </div>

        <button id="loginBtn" class="btn btn-login">登入</button>
        <div class="register-row">沒有帳號？<a id="registerBtn" class="register-link">立即註冊</a></div>

        <div class="divider">橘子平台</div>
        <div class="note"><div class="shield">🛡️</div><div>平台帳號採官方審核制，僅提供已通過審核之接單人員使用。</div></div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal">
    <div class="modal-card">
      <div class="modal-icon">🍊</div>
      <h3>申請專屬後台帳號</h3>
      <p>橘子平台目前採官方審核制。<br>請聯絡官方客服，申請您的專屬後台帳號。</p>
      <button id="closeModal" class="btn">我知道了</button>
    </div>
  </div>

<script>
  const account = document.getElementById('account');
  const password = document.getElementById('password');
  const errorBox = document.getElementById('errorBox');
  const loginBtn = document.getElementById('loginBtn');
  const registerBtn = document.getElementById('registerBtn');
  const modal = document.getElementById('modal');
  const closeModal = document.getElementById('closeModal');
  const togglePwd = document.getElementById('togglePwd');

  loginBtn.addEventListener('click', () => {
    if (!account.value.trim()) {
      errorBox.textContent = '請輸入帳號。';
      errorBox.style.display = 'block';
      account.focus();
      return;
    }
    if (!password.value.trim()) {
      errorBox.textContent = '請輸入密碼。';
      errorBox.style.display = 'block';
      password.focus();
      return;
    }
    errorBox.textContent = '帳號或密碼錯誤，請重新確認。';
    errorBox.style.display = 'block';
  });

  [account,password].forEach(el=>el.addEventListener('input',()=>{errorBox.style.display='none'}));

  togglePwd.addEventListener('click',()=>{
    password.type = password.type === 'password' ? 'text' : 'password';
    togglePwd.textContent = password.type === 'password' ? '👁' : '🙈';
  });

  registerBtn.addEventListener('click',()=>modal.classList.add('show'));
  closeModal.addEventListener('click',()=>modal.classList.remove('show'));
  modal.addEventListener('click',(e)=>{if(e.target===modal) modal.classList.remove('show')});
</script>
</body>
</html>
